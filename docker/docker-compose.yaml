version: '3.8'
name: 'mininet_vnf'

services:
    vnf_nat:
        image: vnf_nat:0.0.4
        build:
            context: ./nat
            dockerfile: Dockerfile.NAT
        container_name: vnf_nat
        stdin_open: true
        tty: true
        cap_add:
            - NET_ADMIN
            - NET_RAW

    vnf_dns:
        image: vnf_dns:0.0.1
        build:
            context: ./dns
            dockerfile: Dockerfile.DNS
        container_name: vnf_dns
        dns:
            - 8.8.8.8
            - 8.8.4.4
        cap_add:
            - NET_ADMIN
        volumes:
            # CoreDNS runs from /coredns and loads ./Corefile.
            - ./dns/Corefile:/coredns/Corefile
            - ./dns/logs:/dns-logs

    vnf_fw:
        image: vnf_firewall:latest
        container_name: vnf_firewall
        build:
            context: ./firewall
            dockerfile: Dockerfile.FIREWALL
        stdin_open: true
        tty: true
        cap_add:
            - NET_ADMIN
            - NET_RAW

    vnf_frr:
        image: vnf_frr:0.0.1
        container_name: vnf_frr
        build:
            context: ./frr
            dockerfile: Dockerfile.FRR
        volumes:
            - ./frr/frr.conf:/etc/frr/frr.conf:ro
            - ./frr/daemons:/etc/frr/daemons:ro
        stdin_open: true
        tty: true
        cap_add:
            - NET_ADMIN
            - NET_RAW

    vnf_tc:
        image: vnf_tc:latest
        container_name: vnf_tc
        build:
            context: ./tc
            dockerfile: Dockerfile.TC
        volumes:
            - ./tc/apply_qos.sh:/scripts/apply_qos.sh:ro
        stdin_open: true
        tty: true
        cap_add:
            - NET_ADMIN
            - NET_RAW

    vnf_lb:
        image: vnf_lb:0.0.1
        container_name: vnf_lb
        build:
            context: ./lb
            dockerfile: Dockerfile.LB
        stdin_open: true
        tty: true

    lb_backend1:
        image: nginx:stable-alpine
        container_name: lb_backend1
        hostname: lb_backend1
        volumes:
            - ./lb/backend1/nginx.conf:/etc/nginx/conf.d/default.conf:ro
            - ./lb/backend1/index.html:/usr/share/nginx/html/index.html:ro
            - ./lb/backend1/slow.txt:/usr/share/nginx/html/slow.txt:ro

    lb_backend2:
        image: nginx:stable-alpine
        container_name: lb_backend2
        hostname: lb_backend2
        volumes:
            - ./lb/backend2/nginx.conf:/etc/nginx/conf.d/default.conf:ro
            - ./lb/backend2/index.html:/usr/share/nginx/html/index.html:ro
            - ./lb/backend2/slow.txt:/usr/share/nginx/html/slow.txt:ro

    vnf_waf:
        build:
            context: ./waf
            dockerfile: Dockerfile.waf
        container_name: vnf_waf
        environment:
            - BACKEND=http://10.0.0.8:80
            - PROXY_SSL=off
            - PORT=8080
            - PARANOIA=1
        volumes:
            - ./waf/logs/nginx:/var/log/nginx
            - ./waf/logs/modsecurity:/var/log/modsecurity
        cap_add:
             - NET_ADMIN

    vnf_proxy:
        image: vnf_proxy:0.0.1
        container_name: vnf_proxy
        build:
            context: ./proxy
            dockerfile: Dockerfile.Proxy
        volumes:
            - ./proxy/logs:/var/log/squid
        stdin_open: true
        tty: true
        cap_add:
            - NET_ADMIN
            - NET_RAW
        privileged: true

    vnf_ids:
        image: vnf_ids:0.0.1
        container_name: vnf_ids
        build:
            context: ./ids
            dockerfile: Dockerfile.ids
            network: host
        volumes:
            - ./proxy/logs:/proxy-logs:ro
            - ./dns/logs:/dns-logs
            - ./waf/logs:/waf-logs:ro
        stdin_open: true
        tty: true
        cap_add:
            - NET_ADMIN
            - NET_RAW

    vnf_cache:
        image: vnf_cache:0.0.1
        container_name: vnf_cache
        build:
            context: ./cache
            dockerfile: Dockerfile.Cache
        volumes:
            - ./cache/logs:/cache-logs
        stdin_open: true
        tty: true
        cap_add:
            - NET_ADMIN

    cache_origin:
        image: cache_origin:0.0.1
        container_name: cache_origin
        build:
            context: ./cache-origin
            dockerfile: Dockerfile.Origin

    prometheus:
        image: prom/prometheus:latest
        container_name: prometheus
        volumes:
            - ./prometheus.yml:/etc/prometheus/prometheus.yml
        ports:
            - "9090:9090"
    
    cadvisor:
        image: gcr.io/cadvisor/cadvisor:latest
        container_name: cadvisor
        volumes:
            - /:/rootfs:ro
            - /var/run:/var/run:ro
            - /sys:/sys:ro
            - /var/lib/docker/:/var/lib/docker:ro
            - /dev/disk/:/dev/disk:ro
        ports:
            - "8080:8080"
        privileged: true

    grafana:
        image: grafana/grafana:latest
        container_name: grafana
        ports:
            - "3000:3000"
        environment:
            - GF_SECURITY_ADMIN_PASSWORD=admin
        volumes:
            - grafana_data:/var/lib/grafana

    dozzle:
        image: ghcr.io/amir20/dozzle:latest
        container_name: dozzle
        ports:
            - "8088:8080"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
    grafana_data: