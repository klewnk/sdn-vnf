worker_processes 1;

events {
    worker_connections 1024;
}

http {
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=edge_cache:10m max_size=100m inactive=10m use_temp_path=off;

    log_format cache_log '$remote_addr "$request" $status cache=$upstream_cache_status '
                         'bytes=$body_bytes_sent time=$request_time upstream=$upstream_response_time';

    access_log /cache-logs/access.log cache_log;
    error_log /cache-logs/error.log warn;

    server {
        listen 80;

        location / {
            proxy_pass http://cache_origin:80;
            proxy_cache edge_cache;
            proxy_cache_valid 200 10m;
            proxy_cache_lock on;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Cache-VNF vnf_cache always;
        }
    }
}
