# 1. Σε ποια πόρτα ακούει ο Proxy
http_port 3128
http_port 3129 intercept

# 2. Ορίζουμε ποιες IPs ανήκουν στο δίκτυό μας (Οι υπολογιστές του Mininet)
acl my_network src 10.0.0.0/24
acl my_network src 10.0.1.0/24

# ==========================================
# 3. ΟΙ "ΜΑΥΡΕΣ ΛΙΣΤΕΣ" ΜΑΣ (Layer 7 Filtering)
# ==========================================
# Α. Μπλοκάρισμα συγκεκριμένων Domains (Σελίδες)
acl blocked_sites dstdomain .facebook.com .youtube.com

# Β. Μπλοκάρισμα συγκεκριμένων Αρχείων (Καταλήξεις - case insensitive)
acl blocked_files urlpath_regex -i \.(exe|torrent|bat|mp4)$

# Γ. Μπλοκάρισμα Λέξεων-Κλειδιών οπουδήποτε μέσα στο URL
acl blocked_keywords url_regex -i games hack casino

# ==========================================
# 4. ΕΦΑΡΜΟΓΗ ΚΑΝΟΝΩΝ (Από πάνω προς τα κάτω)
# ==========================================
# Πρώτα ελέγχουμε τις απαγορεύσεις!
http_access deny blocked_sites
http_access deny blocked_files
http_access deny blocked_keywords

# Αν περάσει τους παραπάνω ελέγχους, επιτρέπεται στο δίκτυό μας
http_access allow my_network

# Κόψε οτιδήποτε άλλο άγνωστο (Best Practice Ασφαλείας)
http_access deny all

# ==========================================
# 5. ΤΟ ΣΕΝΑΡΙΟ ΑΠΟΔΟΣΗΣ: RAM Caching (Χωρίς Δίσκο)
# ==========================================
# Δίνουμε 128MB από τη μνήμη RAM του container για να κρατάει σελίδες
cache_mem 128 MB
# Το μεγαλύτερο αρχείο που θα κρατάει στη μνήμη είναι 10MB
maximum_object_size_in_memory 10 MB
# Κρατάμε τη γραμμή του δίσκου σχολιασμένη για να μην κρασάρει!
# cache_dir ufs /var/spool/squid 100 16 256