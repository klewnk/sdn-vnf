# Proxy ports: explicit proxy and transparent HTTP intercept.
http_port 3128
http_port 3129 intercept

# Mininet subnets allowed to use the proxy.
acl my_network src 10.0.0.0/24
acl my_network src 10.0.1.0/24

# Layer 7 filtering rules.
acl blocked_sites dstdomain .facebook.com .youtube.com
acl blocked_files urlpath_regex -i \.(exe|torrent|bat|mp4|zip)$
acl blocked_keywords url_regex -i games hack casino malware phishing

# Deny blocked content before allowing internal clients.
http_access deny blocked_sites
http_access deny blocked_files
http_access deny blocked_keywords

http_access allow my_network
http_access deny all

# Keep cache in memory for this lab setup.
cache_mem 128 MB
maximum_object_size_in_memory 10 MB
# cache_dir ufs /var/spool/squid 100 16 256